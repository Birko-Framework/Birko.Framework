# Build the whole solution and run every suite that needs no server.
#
# 345 projects build in ~80s, so this is deliberately NOT path-filtered: a change anywhere can
# break a shared project, and proving that in one build is the point of the monorepo.
# Server-backed suites live in live-tests.yml.
#
# WHY THE BUCKET LAYOUT: Birko.Framework.slnx registers the Sandbox aggregator as
# ../../Consumers/Birko.Sandbox/Birko.Framework/Birko.Framework.csproj. Sandbox is a CONSUMER and
# deliberately lives outside this repo, because its whole job is to exercise the $(BirkoSrc)
# consumption mechanism from the outside, which an in-repo project cannot do. A bare checkout
# therefore cannot build the solution (measured: MSB3202, project file not found). Reproducing the
# on-disk bucket layout - Birko/Framework beside Birko/Consumers - makes both the .slnx reference
# and Sandbox's own Directory.Build.props default resolve exactly as they do locally.

name: build-and-test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the framework
        uses: actions/checkout@v4
        with:
          path: birko/Framework

      - name: Check out the Sandbox consumer (registered in the .slnx)
        uses: actions/checkout@v4
        with:
          repository: Birko-Framework/Birko.Sandbox
          path: birko/Consumers/Birko.Sandbox
          token: ${{ secrets.BIRKO_CI_TOKEN || github.token }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build the solution
        run: dotnet build birko/Framework/Birko.Framework/Birko.Framework.slnx --nologo

      # BIRKO_REQUIRE_LIVE is deliberately NOT set: suites needing a server skip themselves here and
      # are covered by live-tests.yml. Setting it would turn every one of those skips into a failure.
      # Birko.DesignTokens.Tests is skipped HERE and covered by token-parity.yml, which is the only
      # workflow that assembles what it needs: BIRKO_SRC plus a checkout of Birko.Web, because
      # CssParityTests compares against Birko.Web.Components/css/ in the other repo. Running it in
      # this job is not extra safety, it is a guaranteed 19 failures in the wrong environment.
      - name: Run offline suites
        working-directory: birko/Framework
        run: |
          fail=0
          for p in tests/*/; do
            name=$(basename "$p")
            case "$name" in Birko.DesignTokens.Tests) echo "skipping $name (owned by token-parity.yml)"; continue;; esac
            dotnet test "$p" --nologo -v q --no-build || { echo "::error::$name failed"; fail=1; }
          done
          exit $fail
