# Build the whole solution and run every suite that needs no server.
#
# 345 projects build in ~80s, so this is deliberately NOT filtered by path — a change anywhere
# can break a shared project, and the whole point of the monorepo is that one build proves it.
# Server-backed suites live in live-tests.yml.

name: build-and-test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build the solution
        run: dotnet build Birko.Framework/Birko.Framework.slnx --nologo

      # BIRKO_REQUIRE_LIVE is deliberately NOT set: suites that need a server skip themselves here
      # and are covered by live-tests.yml. Setting it would turn every skip into a failure.
      - name: Run offline suites
        run: |
          set -o pipefail
          fail=0
          for p in tests/*/; do
            name=$(basename "$p")
            dotnet test "$p" --nologo -v q --no-build || { echo "::error::$name failed"; fail=1; }
          done
          exit $fail
