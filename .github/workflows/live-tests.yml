# Server-backed suites. 14 of the 167 test projects need a real server; the other 153 run in
# build-and-test.yml.
#
# WHY THE PATH FILTER LOOKS WIDE: a change to Birko.Data.Core / .Stores / Birko.Contracts /
# Birko.Configuration reaches EVERY provider, and by EPIC-014's history that shared layer is where
# most provider-breaking defects actually lived. Filtering to Birko.Data.SQL.PostgreSQL/** and
# friends would skip live tests for exactly the changes most likely to need them. Nightly is the
# backstop for whatever the filter misses.
#
# BIRKO_REQUIRE_LIVE=1 IS MANDATORY HERE. Without it, a suite whose server never came up reports
# "skipped" and the job goes green - a broken fixture and a passing run then look identical.
#
# READINESS: wait on a real query, never a readiness probe. pg_isready answers DURING initdb and
# hands back a database about to restart; that once turned a whole TimescaleDB suite red, where
# 15 of 17 "failures" were pure fixture noise.

name: live-tests

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Birko.Data.*/**'
      - 'Birko.BackgroundJobs*/**'
      - 'Birko.Workflow*/**'
      - 'Birko.Contracts/**'
      - 'Birko.Configuration/**'
      - 'tests/Birko.Data.*/**'
      - 'tests/Birko.BackgroundJobs*/**'
      - 'tests/Birko.Workflow*/**'
      - '.github/workflows/live-tests.yml'

env:
  BIRKO_REQUIRE_LIVE: '1'

jobs:
  sql:
    name: SQL (PostgreSQL, MySQL, SQL Server, TimescaleDB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Start servers
        run: |
          docker run -d --name pg    -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=birkoview -p 5432:5432 postgres:16
          docker run -d --name mysql -e MYSQL_ROOT_PASSWORD=root -e MYSQL_DATABASE=birkoview -p 3306:3306 mysql:8.4
          docker run -d --name mssql -e ACCEPT_EULA=Y -e "MSSQL_SA_PASSWORD=Birko!Passw0rd" -p 1433:1433 mcr.microsoft.com/mssql/server:2022-latest
          docker run -d --name ts    -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=birkoview -p 5433:5432 timescale/timescaledb:latest-pg16

      - name: Wait on a real query, then prepare
        run: |
          ready() { for i in $(seq 1 80); do eval "$2" >/dev/null 2>&1 && { echo "$1 ready"; return 0; }; sleep 3; done; echo "::error::$1 never became ready"; return 1; }
          ready postgres  "docker exec pg psql -U postgres -d birkoview -c 'SELECT 1'"
          ready mysql     "docker exec mysql mysql -uroot -proot -e 'SELECT 1' birkoview"
          ready timescale "docker exec ts psql -U postgres -d birkoview -c 'SELECT 1'"
          ready mssql     "docker exec mssql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Birko!Passw0rd' -C -Q 'SELECT 1'"
          docker exec mssql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Birko!Passw0rd' -C -Q "IF DB_ID('birkoview') IS NULL CREATE DATABASE birkoview"
          docker exec ts psql -U postgres -d birkoview -c 'CREATE EXTENSION IF NOT EXISTS timescaledb'

      - name: Run SQL suites
        env:
          BIRKO_PG_HOST: localhost
          BIRKO_PG_PORT: '5432'
          BIRKO_MYSQL_HOST: localhost
          BIRKO_MYSQL_PORT: '3306'
          BIRKO_MSSQL_HOST: localhost
          BIRKO_MSSQL_PORT: '1433'
          BIRKO_TS_HOST: localhost
          BIRKO_TS_PORT: '5433'
        run: |
          fail=0
          for p in Birko.Data.SQL.Tests Birko.Data.SQL.PostgreSQL.Tests Birko.Data.SQL.PostgreSQL.View.Tests \
                   Birko.Data.SQL.MySQL.Tests Birko.Data.SQL.MySQL.View.Tests \
                   Birko.Data.SQL.MSSql.Tests Birko.Data.SQL.MSSql.View.Tests Birko.Data.SQL.Providers.Tests \
                   Birko.Data.Migrations.SQL.Tests Birko.Data.TimescaleDB.Tests \
                   Birko.Data.Migrations.TimescaleDB.Tests Birko.BackgroundJobs.SQL.Tests; do
            dotnet test "tests/$p" --nologo -v q || { echo "::error::$p failed"; fail=1; }
          done
          exit $fail

  mongo:
    name: MongoDB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # A REPLICA SET, not a standalone: MongoDB transactions require one and the transaction
      # boundary suite fails without it.
      - name: Start MongoDB as a replica set and fix the advertised host
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7 --replSet rs0
          for i in $(seq 1 40); do docker exec mongo mongosh --quiet --eval 'db.runCommand({ping:1}).ok' >/dev/null 2>&1 && break; sleep 3; done
          docker exec mongo mongosh --quiet --eval 'rs.initiate()' || true
          sleep 5
          # rs.initiate() advertises the CONTAINER hostname, which the runner cannot resolve: the
          # driver discovers the topology and then times out. Measured locally as 9 failures and a
          # 5-minute run that drops under a second once this is pointed at localhost.
          docker exec mongo mongosh --quiet --eval 'cfg=rs.conf(); cfg.members[0].host="localhost:27017"; rs.reconfig(cfg,{force:true})'
          for i in $(seq 1 40); do [ "$(docker exec mongo mongosh --quiet --eval 'rs.status().myState' 2>/dev/null | tr -d '\r')" = "1" ] && { echo PRIMARY; break; }; sleep 3; done

      - name: Run MongoDB suites
        env:
          BIRKO_MONGO_HOST: localhost
          BIRKO_MONGO_PORT: '27017'
        run: |
          fail=0
          for p in Birko.Data.MongoDB.Tests Birko.Data.MongoDB.Views.Tests Birko.Data.Migrations.MongoDB.Tests \
                   Birko.Workflow.MongoDB.Tests Birko.BackgroundJobs.MongoDB.Tests; do
            dotnet test "tests/$p" --nologo -v q || { echo "::error::$p failed"; fail=1; }
          done
          exit $fail

  # UNVERIFIED FIXTURES (2026-09-18)
  # The three jobs below were written from the suites' env vars, NOT from a measured local run the
  # way sql/ and mongo/ were. Expect each to need one round of fixture debugging on its first
  # execution - mongo needed exactly that (the replica-set host above). Until one green run exists,
  # treat a failure here as a fixture problem to diagnose, not as a product regression.
  raven:
    name: RavenDB (unverified fixture)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Start RavenDB
        run: |
          docker run -d --name raven -p 8080:8080 -e RAVEN_Setup_Mode=None -e RAVEN_License_Eula_Accepted=true -e RAVEN_Security_UnsecuredAccessAllowed=PublicNetwork ravendb/ravendb:latest
          for i in $(seq 1 60); do curl -sf http://localhost:8080/studio/index.html >/dev/null 2>&1 && { echo ready; break; }; sleep 3; done
      - name: Run RavenDB suites
        env:
          BIRKO_RAVEN_URL: http://localhost:8080
        run: dotnet test tests/Birko.Data.RavenDB.Tests --nologo -v q

  redis:
    name: Redis (unverified fixture)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Start Redis
        run: |
          docker run -d --name redis -p 6379:6379 redis:7
          for i in $(seq 1 30); do docker exec redis redis-cli ping >/dev/null 2>&1 && { echo ready; break; }; sleep 2; done
      - name: Run Redis suites
        env:
          BIRKO_REDIS_HOST: localhost
        run: dotnet test tests/Birko.BackgroundJobs.Redis.Tests --nologo -v q

  influx:
    name: InfluxDB (unverified fixture)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Start InfluxDB
        run: |
          docker run -d --name influx -p 8086:8086 -e DOCKER_INFLUXDB_INIT_MODE=setup -e DOCKER_INFLUXDB_INIT_USERNAME=birko -e DOCKER_INFLUXDB_INIT_PASSWORD=birkopassword -e DOCKER_INFLUXDB_INIT_ORG=birko -e DOCKER_INFLUXDB_INIT_BUCKET=birkoview influxdb:2
          for i in $(seq 1 40); do curl -sf http://localhost:8086/health >/dev/null 2>&1 && { echo ready; break; }; sleep 3; done
      - name: Run InfluxDB suites
        env:
          BIRKO_INFLUX_HOST: localhost
          BIRKO_INFLUX_PORT: '8086'
        run: dotnet test tests/Birko.Data.Migrations.InfluxDB.Tests --nologo -v q
