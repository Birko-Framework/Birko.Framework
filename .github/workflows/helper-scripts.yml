# The five root helper scripts, on Linux (TASK-481).
#
# WHY THIS EXISTS: TASK-476 ported four scripts off PowerShell and TASK-477 a fifth, all for Linux
# portability, and both sat in `review` for two days because the only outstanding verification step
# was "run them on a Linux box" - which the machine they were written on is not. Every step in their
# test plans is a machine check; the only human content was owning the right OS.
#
# ASSERT COUNTS, NOT EXIT CODES. Every Linux defect these scripts carried was a SILENT WRONG ANSWER:
# a backslash that does not resolve, a declared bucket that vanishes, a `bin|obj` filter that never
# matches. All of them exited 0. `set -e` would have caught none of them, so each step below asserts
# on a number the script printed.
#
# THIS JOB IS NOT "THE AUDIT". The real vulnerability sweep is whole-family and stays periodic and
# human-run (audit-dependencies' own header: "a PERIODIC check, not a build setting"). What runs here
# is enough of the family to prove the scripts WORK on Linux.

name: helper-scripts

on:
  push:
    branches: [main]
    paths:
      - 'Birko.Framework/audit-*.cs'
      - 'Birko.Framework/install-skills.cs'
      - 'Birko.Framework/tools/**'
      - '.github/workflows/helper-scripts.yml'
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

jobs:
  # The four fast scripts (~15s each locally). The layout - framework at <root>/Framework, a real
  # consumer at <root>/Consumers/<name> - is what the scripts CONTRACT for: audit-dependencies
  # declares both buckets and stops when either is missing (TASK-474's guard, which CI must satisfy
  # rather than weaken). build-and-test.yml already establishes exactly this shape; reused, not
  # reinvented, and with a REAL consumer rather than a synthetic fixture, so a zero import count is
  # a genuine failure signal.
  scripts:
    name: Helper scripts on Linux
    runs-on: ubuntu-latest
    steps:
      - name: Check out the framework
        uses: actions/checkout@v4
        with:
          path: birko/Framework

      - name: Check out the Sandbox consumer
        uses: actions/checkout@v4
        with:
          repository: Birko-Framework/Birko.Sandbox
          path: birko/Consumers/Birko.Sandbox
          token: ${{ secrets.BIRKO_CI_TOKEN || github.token }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The shebang is in every one of these files and has never been executed - TASK-476 added it
      # and marked it "untestable from Windows".
      - name: The shebang actually executes
        working-directory: birko/Framework/Birko.Framework
        run: |
          chmod +x audit-declarations.cs
          ./audit-declarations.cs --help > shebang.txt 2>&1 || true
          grep -q "Usage:" shebang.txt || {
            echo "::error::#!/usr/bin/env dotnet did not run the file"; cat shebang.txt; exit 1; }
          echo "shebang OK"

      - name: audit-declarations
        working-directory: birko/Framework/Birko.Framework
        run: |
          dotnet run audit-declarations.cs | tee out.txt
          # WEAKEST ASSERTION HERE, DELIBERATELY. This script reports the count of OFFENDING
          # projects, never of SCANNED ones, so "0 pairs across 0 projects" is what both a clean
          # sweep and a sweep of nothing print. That is this repo's own recurring defect living
          # inside one of its checkers; TASK-482 adds the scanned count, and this step gets a real
          # assertion then. Until then: the summary line must at least be produced.
          grep -qE "^=== Undeclared: [0-9]+ .project,package. pairs" out.txt || {
            echo "::error::audit-declarations printed no summary"; exit 1; }

      - name: audit-consumer-versions finds a real consumer
        working-directory: birko/Framework/Birko.Framework
        run: |
          dotnet run audit-consumer-versions.cs -- --root "$GITHUB_WORKSPACE/birko" | tee out.txt
          # THE assertion for this script. Its header: "a consumer you know imports Birko and that
          # shows 0 is a defect in this script, not a clean result." On Linux the unported version
          # reported 0 for every consumer, because the import path is backslash-separated in the
          # MSBuild file format on every platform.
          imports=$(grep -oE "Birko\.Sandbox +[0-9]+ projitems" out.txt | grep -oE "[0-9]+" | head -1)
          echo "Sandbox imports: ${imports:-<none>}"
          if [ -z "$imports" ] || [ "$imports" -le 0 ]; then
            echo "::error::Sandbox reported ${imports:-no} projitems imports - the Linux path defect is back"
            exit 1
          fi

      # Prove the check can fail before believing it - each audit-* header says so in as many words.
      - name: ...and would catch a consumer declaring BELOW the framework
        working-directory: birko/Framework/Birko.Framework
        run: |
          target="$GITHUB_WORKSPACE/birko/Consumers/Birko.Sandbox"
          probe=$(grep -rl 'BirkoSrc' --include='*.csproj' "$target" | grep -v '/bin/' | grep -v '/obj/' | head -1)
          if [ -z "$probe" ]; then
            echo "::error::no BirkoSrc-importing csproj to mutate"; exit 1
          fi
          # PRECONDITION, and it is not ceremony. The rule only applies to a package the consumer
          # INHERITS - it must import the projitems that OWNS the declaration. The first version of
          # this step planted Microsoft.Azure.Cosmos, which Birko.Sandbox does not import, so the
          # audit correctly reported nothing and the step failed while both the script and the tree
          # were fine. A mutation aimed at the wrong target tests nothing; assert the target first.
          grep -q 'Birko.Data.SQL.PostgreSQL.projitems' "$probe" || {
            echo "::error::$probe no longer imports Birko.Data.SQL.PostgreSQL - pick another package"
            echo "::error::(it must be one the consumer INHERITS, or the rule does not apply to it)"
            exit 1; }
          echo "mutating $probe"
          cp "$probe" "$probe.bak"
          # Npgsql is declared 10.* by Birko.Data.SQL.PostgreSQL.projitems; 9.0.0 is below it - and
          # is the real shape TASK-473 found in Symbio, sitting in the build for weeks.
          python3 - "$probe" <<'PY'
          import sys
          p = sys.argv[1]
          s = open(p, encoding='utf-8').read()
          s = s.replace('</Project>', '  <ItemGroup><PackageReference Include="Npgsql" Version="9.0.0" /></ItemGroup>\n</Project>', 1)
          open(p, 'w', encoding='utf-8').write(s)
          PY
          dotnet run audit-consumer-versions.cs -- --root "$GITHUB_WORKSPACE/birko" | tee mutated.txt || true
          mv "$probe.bak" "$probe"
          # Assert the VERDICT, not just the package name: "Npgsql" appears in a clean run too.
          grep -qE "Npgsql.*BELOW" mutated.txt || {
            echo "::error::planted Npgsql 9.0.0 below the framework's 10.* and the audit did not report BELOW"
            exit 1; }
          echo "mutation caught - the check can fail"

      # TWO INVOCATIONS, AND THE SECOND IS THE ONE THAT MATTERS.
      #
      # `--check` compares in memory and never calls File.WriteAllText - so it cannot see TASK-477's
      # actual defect, which was the WRITE PATH: the PowerShell original built the output path with a
      # literal backslash, wrote a junk file named `..\ColdTableProbeModels.g.cs` into the wrong
      # directory, left the real output untouched, and exited 0. A check-only step would have gone
      # green against exactly that. So the real generator runs too, and the tree is inspected after.
      - name: gen-cold-table-probes (staleness, then the real write path)
        working-directory: birko/Framework/Birko.Framework
        run: |
          dotnet run tools/gen-cold-table-probes.cs -- --check
          dotnet run tools/gen-cold-table-probes.cs
          cd "$GITHUB_WORKSPACE/birko/Framework"
          for f in tests/Birko.Data.SQL.SqLite.Tests/ColdTableProbeModels.g.cs \
                   tests/Birko.Data.SQL.PostgreSQL.Tests/PgColdTableProbeModels.g.cs; do
            if [ ! -s "$f" ]; then
              echo "::error::$f was not written - PgColdTableProbeModels.g.cs is the one the original never produced at all"
              exit 1
            fi
          done
          # The junk file has a backslash IN ITS NAME, which is legal on Linux and is why the
          # original failed silently rather than erroring.
          junk=$(find . -name '*\\*' -not -path './.git/*' | head -5)
          if [ -n "$junk" ]; then
            echo "::error::files created with a literal backslash in the name:"; echo "$junk"; exit 1
          fi
          # Byte-identical regeneration, including the blank line PostgreSQL has and SQLite does not.
          if ! git diff --quiet; then
            echo "::error::regeneration changed the committed output:"; git diff --stat; exit 1
          fi
          echo "both profiles written, no backslash names, regeneration byte-identical"

      - name: install-skills creates a working symlink
        working-directory: birko/Framework/Birko.Framework
        run: |
          dotnet run install-skills.cs
          # The Windows path makes a junction and needs neither Developer Mode nor elevation; the
          # Linux path makes a symlink. Only one of the two had ever run.
          links=$(find "$HOME/.claude/skills" -maxdepth 1 -type l | wc -l)
          echo "symlinks created: $links"
          if [ "$links" -le 0 ]; then
            echo "::error::install-skills created no symlinks"; exit 1
          fi
          for l in $(find "$HOME/.claude/skills" -maxdepth 1 -type l); do
            if [ ! -r "$l/SKILL.md" ]; then
              echo "::error::$l does not resolve to a readable skill"; exit 1
            fi
          done
          echo "every symlink resolves"

  # SEPARATE JOB, AND NOT ON PUSH. Measured locally: still running past 12 minutes, because it
  # restores every swept project to ask NuGet for vulnerability rows. Its own header calls it "a
  # PERIODIC check, not a build setting", so it runs on the schedule and on demand.
  sweep:
    name: Dependency sweep (nightly)
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: birko/Framework
      - uses: actions/checkout@v4
        with:
          repository: Birko-Framework/Birko.Sandbox
          path: birko/Consumers/Birko.Sandbox
          token: ${{ secrets.BIRKO_CI_TOKEN || github.token }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: audit-dependencies, asserting it swept the whole tree
        working-directory: birko/Framework/Birko.Framework
        run: |
          root="$GITHUB_WORKSPACE/birko"
          # Computed from the tree, never frozen: a hard-coded 248 is wrong the day a project is
          # added, and a wrong constant gets deleted rather than fixed. Mirrors the script's own
          # selection - *.csproj under each declared bucket, excluding bin/obj.
          expected=$(find "$root/Framework/tests" "$root/Consumers" -name '*.csproj' \
                     -not -path '*/bin/*' -not -path '*/obj/*' | wc -l)
          echo "expecting $expected projects"
          dotnet run audit-dependencies.cs -- --root "$root" 2>/dev/null | tee out.txt
          got=$(grep -oE "Auditing [0-9]+ projects" out.txt | grep -oE "[0-9]+" | head -1)
          echo "script swept ${got:-<none>}"
          # TASK-474: a mistyped bucket dropped the entire tests/ tree and the sweep reported 81 of
          # 248 as a whole-tree result. A guard for "none" is not a guard for "fewer than asked for".
          if [ "$got" != "$expected" ]; then
            echo "::error::swept ${got:-0} projects, tree has $expected - a bucket is missing"; exit 1
          fi
          if grep -q "COULD NOT BE AUDITED" out.txt; then
            echo "::error::some projects could not be audited - unknown is not clean"; exit 1
          fi
          echo "whole tree swept"
