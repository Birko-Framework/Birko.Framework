# docs/specs/.map.yml — capability → source map for the /specs skill.
# HAND-EDITABLE: this is the only human-owned file in docs/specs/.
# Spec bodies (<area>.md) are generated by /specs regen — don't hand-edit those.
#
# ── SCOPE: aggregator / cross-cutting only ─────────────────────────────────────
# Birko is a polyrepo: every sibling `Birko.*` directory is its own git repo.
# This repo (Birko.Framework) is the family aggregator, so this map covers only
# CROSS-CUTTING CONTRACTS — behaviour spanning several sibling projects that every
# implementor (backend, provider, decorator) must honour. Source globs therefore
# reach OUT of this repo via `../Birko.X/...`.
#
# Where a contract's whole point is cross-backend conformance, the area includes
# its BACKEND IMPLEMENTORS, not just the interface. This is deliberate: the
# framework's filter-translation bug history (empty `IN` differing per provider,
# ElasticSearch silently dropping clauses) was per-backend DIVERGENCE, which a
# contract-only spec cannot catch. Areas whose backends are large standalone
# surfaces (see out-of-scope list) keep the contract only.
#
# Staleness caveat: `generated-at` stamps THIS repo's HEAD, while sources live in
# sibling repos with independent histories. `/specs verify` can still diff file
# content, but commit-based staleness is weaker here than for a spec sitting next
# to its own code. Per-sub-repo specs (each Birko.X/docs/specs/) are the fix and
# remain deliberate follow-up work.
#
# Note: test code lives in a SIBLING BUCKET (C:\Source\Birko\Framework.Tests), so
# no glob below can reach it. The test entries in `ignore:` are therefore inert
# here — kept only so this map stays correct if tests are ever co-located.
#
# Area count (25) exceeds the skill's ~5–20 guidance. Deliberate: this is a
# 176-project family, and merging unrelated capabilities to hit the number would
# produce noisier regen diffs — defeating the point of diff review.
#
# Deliberately OUT OF SCOPE (single-repo or large standalone surfaces — they
# belong to a future per-sub-repo `docs/specs/`, and are NOT silent under-coverage):
#   Birko.CQRS, Birko.Health*, Birko.Telemetry*, Birko.Localization*, Birko.Time
#   (except Time.Abstractions), Birko.Storage*, Birko.Communication*,
#   Birko.Models.*, Birko.Structures, Birko.Random, Birko.Data.Processors,
#   Birko.Helpers, Birko.Redis (except RedisSettings), Birko.Data.EventSourcing,
#   Birko.Security.OAuth.Server, Birko.Security.NFC, Birko.AI.Providers,
#   Birko.AI.Agents, Birko.AI.Resilience, Birko.AI.Orchestration,
#   Birko.Data.SQL.View*, Birko.Messaging*, Birko.Web.*, Birko.Xaml.*,
#   Birko.DesignTokens, per-backend store bodies (JSON/XML/Mongo/Raven/Cosmos/
#   Influx/Timescale CRUD implementations).
# ───────────────────────────────────────────────────────────────────────────────

areas:
  - name: core-model-contracts
    title: Zero-dependency model contracts (loadable, copyable, default, timestamped)
    sources:
      - ../Birko.Contracts/Models/*.cs
      - ../Birko.Data.Core/Models/*.cs

  - name: store-crud-contract
    title: Store CRUD contract and template-method hierarchy
    sources:
      - ../Birko.Data.Stores/IStore.cs
      - ../Birko.Data.Stores/IAsyncStore.cs
      - ../Birko.Data.Stores/AbstractStore.cs
      - ../Birko.Data.Stores/AbstractAsyncStore.cs
      - ../Birko.Data.Stores/StoreExtensions.cs
      - ../Birko.Data.Stores/StoreLocator.cs
      - ../Birko.Data.Stores/IStoreWrapper.cs
      - ../Birko.Data.Core/Exceptions/StoreException.cs
      # reference conformance: the simplest complete store in the family
      - ../Birko.Data.InMemory/Stores/*.cs
      # NOT the document backends' store bodies: the header's out-of-scope list names them explicitly
      # ("per-backend store bodies … CRUD implementations") as a deliberate exclusion, not a gap. The
      # 2026-08-08 sweep proposed adding them and that was reverted — a coverage number is not an
      # argument against a recorded decision. Individual files still enter an area when a specific
      # cross-backend contract needs them (see bulk-filter-operations' two MongoDB entries).

  - name: store-lazy-initialization
    title: Lazy store initialization (EnsureInitialized double-checked locking)
    sources:
      - ../Birko.Data.Stores/AbstractStore.cs
      - ../Birko.Data.Stores/AbstractAsyncStore.cs
      - ../Birko.Data.Stores/AbstractBulkStore.cs
      - ../Birko.Data.Stores/AbstractAsyncBulkStore.cs

  - name: bulk-filter-operations
    title: Bulk filter-based Update/Delete and Read semantics
    sources:
      - ../Birko.Data.Stores/IBulkStore.cs
      - ../Birko.Data.Stores/IAsyncBulkStore.cs
      - ../Birko.Data.Stores/AbstractBulkStore.cs
      - ../Birko.Data.Stores/AbstractAsyncBulkStore.cs
      - ../Birko.Data.Stores/PropertyUpdate.cs
      - ../Birko.Data.SQL/Stores/DataBaseBulkStore.cs
      - ../Birko.Data.SQL/Stores/AsyncDataBaseBulkStore.cs
      # the bulk Read's sort contract is implemented in the connector's select funnel, not in the
      # store — added for TASK-110, whose fix landed in files no glob reached (silent under-coverage)
      - ../Birko.Data.Stores/OrderBy.cs
      - ../Birko.Data.SQL/SQL/DataBase_OrderBy.cs
      - ../Birko.Data.SQL/SQL/Connectors/AbstractConnector_Select.cs
      - ../Birko.Data.SQL/SQL/Connectors/AbstractAsyncConnector_Select.cs
      # the destructive-write funnels — one per verb per sync/async, and the ONLY place the
      # no-WHERE guard physically lives. Added for TASK-109: the same silent under-coverage as the
      # TASK-110 note above, found the same way (the fix's primary site was reachable by no glob,
      # so a regen could not have seen the behaviour change at all).
      - ../Birko.Data.SQL/SQL/Connectors/AbstractConnector_Delete.cs
      - ../Birko.Data.SQL/SQL/Connectors/AbstractConnector_Update.cs
      - ../Birko.Data.SQL/SQL/Connectors/AbstractAsyncConnector_Delete.cs
      - ../Birko.Data.SQL/SQL/Connectors/AbstractAsyncConnector_Update.cs
      - ../Birko.Data.SQL/Exceptions/WholeTableWriteException.cs
      # backend implementors that override the PUBLIC Delete/Update and so must repeat the guard —
      # cross-backend conformance is the whole point of this contract (§ Areas include their backend
      # implementors). InMemory's pair is already reached via store-crud-contract's Stores/*.cs glob;
      # MongoDB's was reached by nothing, which is how its 4 overrides went unguarded until TASK-109.
      - ../Birko.Data.MongoDB/Stores/MongoDBStore.cs
      - ../Birko.Data.MongoDB/Stores/AsyncMongoDBStore.cs

  - name: filter-expression-translation
    title: LINQ filter expression translation to backend queries
    sources:
      - ../Birko.Data.Core/Expressions/*.cs
      - ../Birko.Data.Core/Filters/*.cs
      - ../Birko.Data.SQL/SQL/DataBase.cs
      - ../Birko.Data.SQL/SQL/Conditions/*.cs
      - ../Birko.Data.SQL/SQL/Connectors/AbstractConnectorBase.cs
      - ../Birko.Data.SQL/SQL/Connectors/IConditionStrategy.cs
      - ../Birko.Data.SQL/SQL/Connectors/SqlBuilderContext.cs
      - ../Birko.Data.SQL/SQL/Connectors/Strategies/*.cs
      # per-provider divergence surface (NormalizeParameterValue, dialect overrides)
      - ../Birko.Data.SQL.MSSql/Database/Connector/*.cs
      - ../Birko.Data.SQL.PostgreSQL/Database/Connectors/*.cs
      - ../Birko.Data.SQL.MySQL/Database/Connectors/*.cs
      - ../Birko.Data.SQL.SqLite/Database/Connectors/*.cs
      - ../Birko.Data.ElasticSearch/ElasticSearch/ElasticSearch.cs
      - ../Birko.Data.ElasticSearch/Stores/ElasticSearchStore.cs
      - ../Birko.Data.ElasticSearch/Stores/AsyncElasticSearchStore.cs

  - name: views-and-aggregation
    title: Fluent view definitions and aggregation queries
    sources:
      - ../Birko.Data.Views/*.cs
      - ../Birko.Data.Stores/Aggregate*.cs
      - ../Birko.Data.Stores/IAggregatableStore.cs
      - ../Birko.Data.Stores/IAsyncAggregatableStore.cs
      - ../Birko.Data.Stores/OrderBy.cs
      - ../Birko.Data.Stores/OrderByHelper.cs
      - ../Birko.Data.Stores/TimeIntervalParser.cs
      # platform translators — the conformance surface for one ViewDefinition
      - ../Birko.Data.SQL.Views/**/*.cs
      # Birko.Data.SQL.View is otherwise out of scope (see the block above), but the view read path's sort
      # contract is implemented in these three files and this spec documents it — added for TASK-128 rather
      # than leaving the behaviour unmapped. Not an opening of that whole project.
      # Three named files out of thirty. The rest of Birko.Data.SQL.View is in the header's out-of-scope
      # list, so the 90% is deliberate rather than silent — the 2026-08-08 sweep proposed widening this to
      # the whole tree and reverted it for that reason. Worth revisiting as a DECISION (TASK-129's
      # aggregate-view DDL defect sits in the excluded part), not as a coverage fix.
      - ../Birko.Data.SQL.View/SQL/DataBase_ViewOrderBy.cs
      - ../Birko.Data.SQL.View/SQL/Connectors/AbstractConnector_SelectView.cs
      - ../Birko.Data.SQL.View/SQL/Connectors/AbstractAsyncConnector_SelectView.cs
      # per-backend aggregation helpers — the other half of this area's contract
      - ../Birko.Data.MongoDB/Aggregation/*.cs
      - ../Birko.Data.RavenDB/Aggregation/*.cs
      - ../Birko.Data.CosmosDB/Aggregation/*.cs
      - ../Birko.Data.MongoDB.Views/**/*.cs
      - ../Birko.Data.ElasticSearch.Views/**/*.cs
      - ../Birko.Data.RavenDB.Views/**/*.cs
      - ../Birko.Data.CosmosDB.Views/**/*.cs
      - ../Birko.Data.ElasticSearch/Aggregation/StoreAggregationHelper.cs

