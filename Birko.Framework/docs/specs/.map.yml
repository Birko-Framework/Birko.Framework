# docs/specs/.map.yml — capability → source map for the /specs skill.
# HAND-EDITABLE: this is the only human-owned file in docs/specs/.
# Spec bodies (<area>.md) are generated by /specs regen — don't hand-edit those.
#
# ── SCOPE: aggregator / cross-cutting only ─────────────────────────────────────
# The framework is ONE git repo; every `Birko.*` directory is a sibling directory in it
# and this directory (Birko.Framework) is the aggregator. This map covers CROSS-CUTTING
# CONTRACTS — behaviour spanning several projects that every implementor (backend,
# provider, decorator) must honour. Source globs reach siblings via `../Birko.X/...`,
# which are now paths INSIDE this repo.
#
# ── The staleness guard works again (was TASK-131) ─────────────────────────────
# Under the old polyrepo every glob reached OUT of the aggregator's repo while
# `generated-at` stamped only the aggregator's HEAD, so /specs verify's primitive
#     git diff --name-only <generated-at>..HEAD -- <sources>
# could never observe a source change — the guard was not merely weak, it was
# DECORATIVE, and [[roadmap]]'s DV7/DV8 inherited that. In one repo the sources and
# the stamp are in the same history, so drift is detectable for the first time.
# If a regen ever reports "no source change" for an area you know moved, that is now
# a real signal worth chasing rather than the expected answer.
#
# Where a contract's whole point is cross-backend conformance, the area includes
# its BACKEND IMPLEMENTORS, not just the interface. This is deliberate: the
# framework's filter-translation bug history (empty `IN` differing per provider,
# ElasticSearch silently dropping clauses) was per-backend DIVERGENCE, which a
# contract-only spec cannot catch. Areas whose backends are large standalone
# surfaces (see the ignore block's "not specced here" entries) keep the contract only.
#
# Staleness: `generated-at` stamps THIS repo's HEAD, while sources live in sibling
# repos with independent histories — so for the whole life of this map, commit-based
# staleness could not fire at all and every area reported fresh forever. Not a weaker
# guard: a guard that was green by construction (TASK-131).
#
# Fixed 2026-08-16. Each spec now carries `source-commits:`, a per-sibling baseline
# keyed by the path prefix as it appears in `sources`, and `/specs verify` resolves
# each external glob with `git -C <sibling> diff <sha>..HEAD`. First run: 15 of 25
# areas stale, 40 changed source files, none of it previously visible.
#
# BASELINE AMNESTY, one time: nothing recorded each sibling's HEAD at regen time, so
# the baselines had to be RECONSTRUCTED. Anchor chosen by measurement, after two
# worse candidates were tried and discarded:
#   - today's HEAD          -> amnesties everything; 12 specs date from 2026-07-30,
#                              so 17 days of drift would have been forgiven silently.
#   - `generated-on`        -> hand-written, and measured to disagree with the real
#                              harvest by a full day on 6 of 25 specs.
#   - the commit that last  -> USED. Precise to the second and derived from git, not
#     WROTE the spec           from a field a human typed.
# The last of those is right because `generated-at` is itself systematically too
# early: regen stamps `rev-parse HEAD` BEFORE the spec file is committed, so the
# stamp always names the commit preceding the one carrying the spec. Measured: true
# for all 25, with gaps up to 8 hours. Anchoring on generated-at manufactured 9 false
# stale areas (15 -> 6 once corrected). See TASK-227.
#
# Regens from here on record the shas exactly and this note stops applying to them;
# 6 areas already carry `# recorded at this regen`. What no reconstruction can see is
# drift between a sibling commit and the spec commit that followed it minutes later.
#
# Per-sub-repo specs (each Birko.X/docs/specs/) were long recorded here as "the fix".
# Measured: only 4 of 25 areas are single-repo, so that move addresses 16% of the map
# and cannot host a cross-repo area at all. Still worth doing on its own merits for
# those 4 plus the 64 unspecced single-repo projects -- TASK-226 -- but it is not the
# staleness fix and should not be cited as one.
#
# Note: test code is now CO-LOCATED, under `../tests/Birko.X.Tests/`, so a careless
# glob CAN reach it. The test entries in `ignore:` (notably `**/*Tests*/**`) are
# therefore LIVE rather than inert — they are what keeps specs harvested from
# production source only. Do not remove them.
#
# Area count (26; backend-store-implementations added by TASK-689) exceeds the skill's ~5–20 guidance. Deliberate: this is a
# 176-project family, and merging unrelated capabilities to hit the number would
# produce noisier regen diffs — defeating the point of diff review.
#
# What this map does NOT spec is now written as globs in `ignore:` (TASK-689), each family checked rather than
# assumed: commits since 2026-09-01 and the area contracts it references, and the ambiguous ones read. The prose
# list that stood here was never checked against a scan, and the first check (2026-10-20) overturned part of it,
# decided by the user:
#   - the per-backend store bodies were the MOST-changed excluded projects (10-30 commits each), so they and the
#     backends' repositories got their own area, backend-store-implementations;
#   - AI.Providers/Agents/Orchestration/Resilience joined llm-provider-and-agents, Models.SQL schema-index-and-ddl,
#     Birko.Data.SQL.View views-and-aggregation, Data.EventSourcing and Telemetry's wrappers
#     store-decorator-composition, the transport auth adapters and the owner-or-admin rule security-and-authorization.
# "own tree" entries in `ignore:` are real behaviour awaiting a per-project spec tree (TASK-226), not a claim that
# they need no spec.
# ───────────────────────────────────────────────────────────────────────────────

coverage: verified
